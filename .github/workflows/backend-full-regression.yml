name: Backend Full Regression

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    name: Backend full regression
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      FLASK_ENV: testing
      PYTHONPATH: backend:testing
      DATABASE_URL: "postgresql+psycopg://gate11:gate11_test@127.0.0.1:55433/clinic_gate11"
      PHASE9_TEST_DATABASE_URL: "postgresql+psycopg://gate11:gate11_test@127.0.0.1:55433/clinic_gate11"
      TEST_REDIS_URL: "redis://127.0.0.1:56379/15"
      REDIS_URL: "redis://127.0.0.1:56379/15"
      CELERY_BROKER_URL: "redis://127.0.0.1:56379/15"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:56379/15"
      SECRET_KEY: "clinic-ci-disposable-secret"
      JWT_SECRET_KEY: "clinic-ci-disposable-jwt-secret"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      BACKUP_ENCRYPTION_KEY_VERSION: "1"
      INTEGRATION_ENCRYPTION_KEY_VERSION: "1"
      PGCONNECT_TIMEOUT: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements.lock

      - name: Generate disposable test encryption keys
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet

          values = {
              "INTEGRATION_ENCRYPTION_KEY": Fernet.generate_key().decode("ascii"),
              "BACKUP_ENCRYPTION_KEY": Fernet.generate_key().decode("ascii"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Start named disposable PostgreSQL and Redis
        shell: bash
        run: |
          docker run --detach \
            --name clinic-gate11-postgres \
            --env POSTGRES_USER=gate11 \
            --env POSTGRES_PASSWORD=gate11_test \
            --env POSTGRES_DB=clinic_gate11 \
            --publish 127.0.0.1:55433:5432 \
            postgres:18

          docker run --detach \
            --name clinic-gate11-redis \
            --publish 127.0.0.1:56379:6379 \
            redis:8

          ready=0
          for attempt in $(seq 1 60); do
            if docker exec clinic-gate11-postgres \
              pg_isready -U gate11 -d clinic_gate11 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec clinic-gate11-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Apply database migrations
        working-directory: backend
        env:
          FLASK_ENV: production
          PYTHONPATH: ".:../testing"
        run: python -m flask --app run:app db upgrade

      - name: Run complete backend regression
        run: python -m pytest -q

      - name: Remove disposable test containers
        if: always()
        shell: bash
        run: |
          docker rm -f clinic-gate11-postgres clinic-gate11-redis || true
