events {}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Record upstream routing and timing without logging request paths or credentials.
    log_format upstream_route
        '$time_iso8601 upstream=$upstream_addr '
        'status=$status request_time=$request_time '
        'upstream_response_time=$upstream_response_time';
    access_log /dev/stdout upstream_route;

    upstream clinic_api_backend {
        zone clinic_api_backend 64k;
        server backend:5000 resolve max_fails=2 fail_timeout=10s;
    }

    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    server {
        listen 80 default_server;
        server_name localhost;

        if ($host != localhost) {
            return 444;
        }

        return 308 https://localhost:18443$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        server_name localhost;

        if ($host != localhost) {
            return 444;
        }

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://clinic_api_backend;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_http_version 1.1;

            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
