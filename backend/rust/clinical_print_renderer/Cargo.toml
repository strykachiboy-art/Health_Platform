[package]
name = "clinical_print_renderer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
genpdf = "=0.2.0"
printpdf = { version = "=0.3.4", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusttype = "=0.9.3"

[profile.release]
strip = true
panic = "abort"
