services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: clinic_system
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_phase6
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Preserve the image's existing Gunicorn command; keep an explicit 40s container stop grace period.
    stop_grace_period: 40s
    build:
      context: ./backend
    environment:
      FLASK_ENV: production
      PORT: 5000
      # Drain control stays disabled until a strong token is provisioned.
      PHASE9_BACKEND_DRAIN_TOKEN: ${PHASE9_BACKEND_DRAIN_TOKEN:-}
      SECRET_KEY: phase6-development-secret
      JWT_SECRET_KEY: phase6-development-jwt-secret
      DATABASE_URL: postgresql://clinic:clinic_phase6@postgres:5432/clinic_system
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PAYMENT_WEBHOOK_RATE_LIMIT: "${PAYMENT_WEBHOOK_RATE_LIMIT:-300 per minute}"
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=INFO"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: phase6-development-secret
      JWT_SECRET_KEY: phase6-development-jwt-secret
      DATABASE_URL: postgresql://clinic:clinic_phase6@postgres:5432/clinic_system
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: ["celery", "-A", "celery_worker.celery", "beat", "--loglevel=INFO"]
    environment:
      FLASK_ENV: production
      SECRET_KEY: phase6-development-secret
      JWT_SECRET_KEY: phase6-development-jwt-secret
      DATABASE_URL: postgresql://clinic:clinic_phase6@postgres:5432/clinic_system
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:8443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
