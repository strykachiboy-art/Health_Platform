services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PHASE6_POSTGRES_DB:?PHASE6_POSTGRES_DB is required}
      POSTGRES_USER: ${PHASE6_POSTGRES_USER:?PHASE6_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${PHASE6_POSTGRES_PASSWORD:?PHASE6_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Preserve the image's existing Gunicorn command; keep an explicit 40s container stop grace period.
    stop_grace_period: 40s
    build:
      context: ./backend
    environment:
      FLASK_ENV: production
      SQLALCHEMY_POOL_SIZE: "${PHASE6_SQLALCHEMY_POOL_SIZE:-3}"
      SQLALCHEMY_MAX_OVERFLOW: "${PHASE6_SQLALCHEMY_MAX_OVERFLOW:-2}"
      SQLALCHEMY_POOL_TIMEOUT_SECONDS: "${PHASE6_SQLALCHEMY_POOL_TIMEOUT_SECONDS:-5}"
      SQLALCHEMY_POOL_RECYCLE_SECONDS: "${PHASE6_SQLALCHEMY_POOL_RECYCLE_SECONDS:-1800}"
      PORT: 5000
      # Drain control stays disabled until a strong token is provisioned.
      PHASE9_BACKEND_DRAIN_TOKEN: ${PHASE9_BACKEND_DRAIN_TOKEN:-}
      SECRET_KEY: ${PHASE6_SECRET_KEY:?PHASE6_SECRET_KEY is required}
      JWT_SECRET_KEY: ${PHASE6_JWT_SECRET_KEY:?PHASE6_JWT_SECRET_KEY is required}
      DATABASE_URL: postgresql://${PHASE6_POSTGRES_USER:?PHASE6_POSTGRES_USER is required}:${PHASE6_POSTGRES_PASSWORD:?PHASE6_POSTGRES_PASSWORD is required}@postgres:5432/${PHASE6_POSTGRES_DB:?PHASE6_POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PAYMENT_WEBHOOK_RATE_LIMIT: "${PAYMENT_WEBHOOK_RATE_LIMIT:-300 per minute}"
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${PHASE6_BACKUP_ENCRYPTION_KEY:?PHASE6_BACKUP_ENCRYPTION_KEY is required}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_KEY: ${PHASE6_INTEGRATION_ENCRYPTION_KEY:?PHASE6_INTEGRATION_ENCRYPTION_KEY is required}
      INTEGRATION_ENCRYPTION_KEY_VERSION: ${INTEGRATION_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_LEGACY_KEYS: ${INTEGRATION_ENCRYPTION_LEGACY_KEYS:-{}}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      FLASK_ENV: production
      SQLALCHEMY_POOL_SIZE: "${PHASE6_SQLALCHEMY_POOL_SIZE:-3}"
      SQLALCHEMY_MAX_OVERFLOW: "${PHASE6_SQLALCHEMY_MAX_OVERFLOW:-2}"
      SQLALCHEMY_POOL_TIMEOUT_SECONDS: "${PHASE6_SQLALCHEMY_POOL_TIMEOUT_SECONDS:-5}"
      SQLALCHEMY_POOL_RECYCLE_SECONDS: "${PHASE6_SQLALCHEMY_POOL_RECYCLE_SECONDS:-1800}"
      SECRET_KEY: ${PHASE6_SECRET_KEY:?PHASE6_SECRET_KEY is required}
      JWT_SECRET_KEY: ${PHASE6_JWT_SECRET_KEY:?PHASE6_JWT_SECRET_KEY is required}
      DATABASE_URL: postgresql://${PHASE6_POSTGRES_USER:?PHASE6_POSTGRES_USER is required}:${PHASE6_POSTGRES_PASSWORD:?PHASE6_POSTGRES_PASSWORD is required}@postgres:5432/${PHASE6_POSTGRES_DB:?PHASE6_POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${PHASE6_BACKUP_ENCRYPTION_KEY:?PHASE6_BACKUP_ENCRYPTION_KEY is required}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_KEY: ${PHASE6_INTEGRATION_ENCRYPTION_KEY:?PHASE6_INTEGRATION_ENCRYPTION_KEY is required}
      INTEGRATION_ENCRYPTION_KEY_VERSION: ${INTEGRATION_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_LEGACY_KEYS: ${INTEGRATION_ENCRYPTION_LEGACY_KEYS:-{}}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: ["celery", "-A", "celery_worker.celery", "beat", "--loglevel=INFO"]
    environment:
      FLASK_ENV: production
      SQLALCHEMY_POOL_SIZE: "${PHASE6_SQLALCHEMY_POOL_SIZE:-3}"
      SQLALCHEMY_MAX_OVERFLOW: "${PHASE6_SQLALCHEMY_MAX_OVERFLOW:-2}"
      SQLALCHEMY_POOL_TIMEOUT_SECONDS: "${PHASE6_SQLALCHEMY_POOL_TIMEOUT_SECONDS:-5}"
      SQLALCHEMY_POOL_RECYCLE_SECONDS: "${PHASE6_SQLALCHEMY_POOL_RECYCLE_SECONDS:-1800}"
      SECRET_KEY: ${PHASE6_SECRET_KEY:?PHASE6_SECRET_KEY is required}
      JWT_SECRET_KEY: ${PHASE6_JWT_SECRET_KEY:?PHASE6_JWT_SECRET_KEY is required}
      DATABASE_URL: postgresql://${PHASE6_POSTGRES_USER:?PHASE6_POSTGRES_USER is required}:${PHASE6_POSTGRES_PASSWORD:?PHASE6_POSTGRES_PASSWORD is required}@postgres:5432/${PHASE6_POSTGRES_DB:?PHASE6_POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      BACKUP_ENCRYPTION_KEY: ${PHASE6_BACKUP_ENCRYPTION_KEY:?PHASE6_BACKUP_ENCRYPTION_KEY is required}
      BACKUP_ENCRYPTION_KEY_VERSION: ${BACKUP_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_KEY: ${PHASE6_INTEGRATION_ENCRYPTION_KEY:?PHASE6_INTEGRATION_ENCRYPTION_KEY is required}
      INTEGRATION_ENCRYPTION_KEY_VERSION: ${INTEGRATION_ENCRYPTION_KEY_VERSION:-1}
      INTEGRATION_ENCRYPTION_LEGACY_KEYS: ${INTEGRATION_ENCRYPTION_LEGACY_KEYS:-{}}
    volumes:
      - ./runtime/storage:/data/storage
      - ./runtime/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:8443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
